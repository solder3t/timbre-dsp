name: Build & Test

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      artifact_type:
        description: 'Release artifact type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both
      publish_release:
        description: 'Create a GitHub Release'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: (inputs.build_type == 'debug' || inputs.build_type == 'both') && success()
        uses: actions/upload-artifact@v6
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Restore release keystore
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is required for release signing." >&2
            exit 1
          fi

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | openssl base64 -d -A -out release-key.jks
          cp release-key.jks app/release-key.jks

      - name: Validate release keystore
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: |
          keytool -list \
            -keystore release-key.jks \
            -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            >/dev/null

      - name: Write keystore properties
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: |
          echo "storeFile=release-key.jks" > keystore.properties
          echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties
          cp keystore.properties app/keystore.properties

      - name: Determine artifact type
        id: artifacts
        run: echo "type=${{ inputs.artifact_type }}" >> $GITHUB_OUTPUT

      - name: Build release APK
        if: (inputs.build_type == 'release' || inputs.build_type == 'both') && (steps.artifacts.outputs.type == 'apk' || steps.artifacts.outputs.type == 'both')
        run: ./gradlew assembleRelease

      - name: Build release AAB
        if: (inputs.build_type == 'release' || inputs.build_type == 'both') && (steps.artifacts.outputs.type == 'aab' || steps.artifacts.outputs.type == 'both')
        run: ./gradlew bundleRelease

      - name: Upload release APK
        if: (inputs.build_type == 'release' || inputs.build_type == 'both') && (steps.artifacts.outputs.type == 'apk' || steps.artifacts.outputs.type == 'both') && success()
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release AAB
        if: (inputs.build_type == 'release' || inputs.build_type == 'both') && (steps.artifacts.outputs.type == 'aab' || steps.artifacts.outputs.type == 'both') && success()
        uses: actions/upload-artifact@v6
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.publish_release == true && (inputs.build_type == 'release' || inputs.build_type == 'both')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download release APK
        if: inputs.artifact_type == 'apk' || inputs.artifact_type == 'both'
        uses: actions/download-artifact@v6
        with:
          name: release-apk
          path: dist/apk

      - name: Download release AAB
        if: inputs.artifact_type == 'aab' || inputs.artifact_type == 'both'
        uses: actions/download-artifact@v6
        with:
          name: release-aab
          path: dist/aab

      - name: Generate version tag
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "tag=v${VERSION_NAME}-${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "name=Timbre DSP v${VERSION_NAME} (${VERSION_CODE})" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/apk/*.apk
            dist/aab/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
