name: Build & Test

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      artifact_type:
        description: 'Release artifact type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both
      publish_release:
        description: 'Create a GitHub Release'
        required: false
        default: false
        type: boolean
      release_notes:
        description: 'Custom Release Notes / Changelog (Optional Markdown)'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: (inputs.build_type == 'debug' || inputs.build_type == 'both') && success()
        uses: actions/upload-artifact@v6
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Restore release keystore
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is required for release signing." >&2
            exit 1
          fi

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | openssl base64 -d -A -out release-key.jks
          cp release-key.jks app/release-key.jks

      - name: Validate release keystore
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: |
          keytool -list \
            -keystore release-key.jks \
            -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            >/dev/null

      - name: Write keystore properties
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: |
          echo "storeFile=release-key.jks" > keystore.properties
          echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties
          cp keystore.properties app/keystore.properties

      - name: Determine artifact type
        id: artifacts
        run: echo "type=${{ inputs.artifact_type }}" >> $GITHUB_OUTPUT

      - name: Build release APK
        if: (inputs.build_type == 'release' || inputs.build_type == 'both') && (steps.artifacts.outputs.type == 'apk' || steps.artifacts.outputs.type == 'both')
        run: ./gradlew assembleRelease

      - name: Build release AAB
        if: (inputs.build_type == 'release' || inputs.build_type == 'both') && (steps.artifacts.outputs.type == 'aab' || steps.artifacts.outputs.type == 'both')
        run: ./gradlew bundleRelease

      - name: Upload release APK
        if: (inputs.build_type == 'release' || inputs.build_type == 'both') && (steps.artifacts.outputs.type == 'apk' || steps.artifacts.outputs.type == 'both') && success()
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release AAB
        if: (inputs.build_type == 'release' || inputs.build_type == 'both') && (steps.artifacts.outputs.type == 'aab' || steps.artifacts.outputs.type == 'both') && success()
        uses: actions/upload-artifact@v6
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.publish_release == true && (inputs.build_type == 'release' || inputs.build_type == 'both')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release APK
        if: inputs.artifact_type == 'apk' || inputs.artifact_type == 'both'
        uses: actions/download-artifact@v6
        with:
          name: release-apk
          path: dist/apk

      - name: Download release AAB
        if: inputs.artifact_type == 'aab' || inputs.artifact_type == 'both'
        uses: actions/download-artifact@v6
        with:
          name: release-aab
          path: dist/aab

      - name: Generate version tag
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "tag=v${VERSION_NAME}-${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "name=Timbre DSP v${VERSION_NAME} (${VERSION_CODE})" >> $GITHUB_OUTPUT

      - name: Prepare release files
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -d "dist/apk" ]; then
            for apk in dist/apk/*.apk; do
              [ -f "$apk" ] || continue
              mv "$apk" "dist/apk/Timbre-DSP-v${VERSION_NAME}.apk"
            done
          fi
          if [ -d "dist/aab" ]; then
            for aab in dist/aab/*.aab; do
              [ -f "$aab" ] || continue
              mv "$aab" "dist/aab/Timbre-DSP-v${VERSION_NAME}.aab"
            done
          fi

      - name: Generate changelog
        id: changelog
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          
          # 1. Check if user provided manual release notes via workflow dispatch input
          MANUAL_NOTES="${{ inputs.release_notes }}"
          if [ -n "$MANUAL_NOTES" ]; then
            echo "Using release notes provided via workflow input."
            {
              echo "body<<EOF"
              echo "$MANUAL_NOTES"
              echo "EOF"
            } >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. Check if CHANGELOG.md has an entry for this version
          if [ -f "CHANGELOG.md" ]; then
            EXTRACTED=$(sed -n "/## \[$VERSION_NAME\]/,/## \[/p" CHANGELOG.md | sed '$d' | sed '1d' | sed '/^[[:space:]]*$/d')
            if [ -z "$EXTRACTED" ]; then
              EXTRACTED=$(sed -n "/## v$VERSION_NAME/,/## v/p" CHANGELOG.md | sed '$d' | sed '1d' | sed '/^[[:space:]]*$/d')
            fi
            if [ -z "$EXTRACTED" ]; then
              EXTRACTED=$(sed -n "/## $VERSION_NAME/,/## /p" CHANGELOG.md | sed '$d' | sed '1d' | sed '/^[[:space:]]*$/d')
            fi
            if [ -n "$EXTRACTED" ]; then
              echo "Extracted changelog from CHANGELOG.md for v$VERSION_NAME."
              {
                echo "body<<EOF"
                echo "$EXTRACTED"
                echo "EOF"
              } >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # 3. Fallback: Automatically extract clean commit history since previous release tag
          echo "Extracting changelog from git commits..."
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"• %s" --no-merges | grep -v "Merge branch" | grep -v "chore(release)" || true)
          else
            COMMITS=$(git log -n 15 --pretty=format:"• %s" --no-merges | grep -v "Merge branch" | grep -v "chore(release)" || true)
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="• General stability improvements and DSP audio engine optimizations."
          fi

          {
            echo "body<<EOF"
            echo "### What's New in v${VERSION_NAME}"
            echo ""
            echo "$COMMITS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          files: |
            dist/apk/*.apk
            dist/aab/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
